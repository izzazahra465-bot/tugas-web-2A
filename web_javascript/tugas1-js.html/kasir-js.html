<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASIR-JS</title>
    <style>
        /* CSS sederhana untuk mengatur tampilan font agar rapi seperti struk */
        body {
            font-family: monospace; 
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Struk Belanja</h1>

    <script type="text/javascript">
        // 1. Input nama barang
        let nama = prompt("Masukkan nama barang: ");
        // 2. Input harga barang
        let harga = prompt("Masukkan Harga barang: ");
        // 3. Input jumlah beli (qty)
        let qty = prompt("Masukkan jumlah beli (qty): ");

        let hargaNum = parseFloat(harga);
        let qtyNum = parseInt(qty);

        let totalBelanja = hargaNum * qtyNum;
        let diskon = 0;

        // 4. Jika pembelian lebih dari 50.000 dapat diskon 10% dari total
        if (totalBelanja > 50000) {
            diskon = totalBelanja * 0.10;
        }

        let pembayaran = totalBelanja - diskon;

        // 5. Tampilan Struk belanja tanpa tanda +
        document.write("<pre>"); 
        document.write("nama  Harga  qty  total\n");
        document.write("-----------------------\n");
        document.write(nama + "\n");
        document.write("      " + hargaNum + "  " + qtyNum + "    " + totalBelanja + "\n");
        document.write("\n");
        document.write("total belanja : " + totalBelanja + "\n");
        document.write("diskon        : " + diskon + "\n");
        document.write("pembayaran    : " + pembayaran + "\n");
        document.write("</pre>");
    </script>
</body>
</html>
